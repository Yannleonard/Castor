# Castor — Kubernetes overlay (read-only cluster view).
#
#   export CASTOR_SECRET_KEY=$(openssl rand -hex 32)
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.kube.yml up -d
#
# Use a self-contained kubeconfig (embedded credentials, read-scoped).
# The cluster address must be reachable from inside the container (not 127.0.0.1).

services:
  castor:
    volumes:
      # Kubeconfig of the current user, mounted read-only. Override $HOME if needed.
      - ${HOME}/.kube/config:/home/nonroot/.kube/config:ro
    environment:
      CASTOR_KUBECONFIG: "/home/nonroot/.kube/config"
