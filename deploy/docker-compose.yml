# Castor — one-command deployment.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Then open https://localhost:8443 and create the admin account.
# A copy of this file lives at the repo root, so `docker compose up -d` works from there too.

services:
  castor:
    image: ghcr.io/yannleonard/castor:latest
    # To build locally instead, replace `image:` with:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    #   args:
    #     VERSION: dev
    #     COMMIT: local
    container_name: castor
    hostname: castor
    restart: unless-stopped

    ports:
      # https://localhost:8443 (UI + API); http://localhost:8080 redirects to HTTPS.
      - "8080:8080"
      - "8443:8443"
      # Let's Encrypt: publish the standard ports instead and enable it in
      # Settings → HTTPS & certificates. Castor is then reached at https://<domain>.
      # - "80:8080"
      # - "443:8443"

    environment:
      # Optional; generated in /data/secret.key when unset (openssl rand -hex 32 to supply your own).
      CASTOR_SECRET_KEY: ${CASTOR_SECRET_KEY:-}
      CASTOR_HTTP_ADDR: ":8080"
      CASTOR_HTTPS_ADDR: ":8443"
      # Default TLS mode; the mode chosen in Settings takes precedence, except `off`,
      # which is managed by the environment and cannot be changed from the UI.
      #   self-signed  generated certificate (default)
      #   custom       certificate imported in Settings
      #   acme         Let's Encrypt (public DNS name + ports 80/443)
      #   off          plain HTTP, for a reverse proxy that terminates TLS
      CASTOR_TLS_MODE: ${CASTOR_TLS_MODE:-self-signed}
      # Extra names / IPs (comma-separated) covered by the self-signed certificate.
      CASTOR_TLS_SELF_SIGNED_HOSTS: ${CASTOR_TLS_SELF_SIGNED_HOSTS:-}
      CASTOR_DB_PATH: "/data/castor.db"
      # Set to true only behind a reverse proxy that terminates TLS (with CASTOR_TLS_MODE=off).
      CASTOR_TRUST_PROXY: ${CASTOR_TRUST_PROXY:-false}
      # Name of this container; Castor never stops or removes itself from the UI.
      CASTOR_SELF_CONTAINER_ID: ${CASTOR_SELF_CONTAINER_ID:-castor}
      # Optional token for unattended first-run setup; leave unset for the interactive screen.
      CASTOR_BOOTSTRAP_TOKEN: ${CASTOR_BOOTSTRAP_TOKEN:-}

    volumes:
      # Docker socket, read-only by default (list, inspect, logs, stats).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Full read+write Docker control: use this line instead.
      # - /var/run/docker.sock:/var/run/docker.sock:rw
      # Database, settings, TLS material and secret key. Back up this volume.
      - castor-data:/data

    # Container hardening: read-only root filesystem, no privilege escalation, minimal capabilities.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE

    # Same check as the image HEALTHCHECK.
    healthcheck:
      test: ["CMD", "/usr/local/bin/castor", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Persistent data. Back it up by copying /data.
  castor-data:
    name: castor-data
